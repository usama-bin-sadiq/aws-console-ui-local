services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: aws-console-ministack
    ports:
      - "4567:4566"
    environment:
      - PERSIST_STATE=1
      - S3_PERSIST=1
      - LOG_LEVEL=INFO
      - LAMBDA_EXECUTOR=docker
      - DOCKER_NETWORK=aws-console_default
    volumes:
      - ./data/ministack/state:/tmp/ministack-state
      - ./data/ministack/s3:/tmp/ministack-data/s3
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    container_name: aws-console-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,s3,lambda,iam,rds,dynamodb,vpc,cloudwatch,cloudtrail,config,cloudformation,route53,cloudfront,secretsmanager,kms,eventbridge,ecs,eks,ssm,lambda,logs
      - DEBUG=0
      - PERSISTENCE=1
      - LambdFlags=-p 4566
    volumes:
      - ./data/localstack/state:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles:
      - localstack
    restart: unless-stopped

  localstack-health:
    image: alpine/curl
    container_name: aws-console-localstack-health
    depends_on:
      - localstack
    command:
      [
        "/bin/sh",
        "-c",
        "while ! curl -f http://localstack:4566/_localstack/health; do sleep 1; done",
      ]
    restart: unless-stopped

  aws-console:
    build: .
    container_name: aws-console-app
    ports:
      - "3000:3000"
    environment:
      - LOCALSTACK_HOSTNAME=localstack
      - LOCALSTACK_EDGE_PORT=4566
      - MINSTACK_HOSTNAME=ministack
      - MINSTACK_EDGE_PORT=4566
      - MINSTACK_ENDPOINT=http://ministack:4566
      - ADAPTER_MODE=localstack
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - localstack
      - localstack-health
    volumes:
      - .:/app
    command: ["npm", "run", "dev"]

volumes:
  ministack-state:
  ministack-s3:
  localstack-state:
