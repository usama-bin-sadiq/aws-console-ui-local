services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: aws-console-ministack
    ports:
      - "4566:4566"
    environment:
      - PERSIST_STATE=1
      - S3_PERSIST=1
      - LOG_LEVEL=INFO
      - LAMBDA_EXECUTOR=docker
      - DOCKER_NETWORK=aws-console_default
    volumes:
      - ./data/ministack/state:/tmp/ministack-state
      - ./data/ministack/s3:/tmp/ministack-data/s3
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    container_name: aws-console-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=all
      - DEBUG=0
      - PERSISTENCE=1
      - LambdFlags=-p 4566
    volumes:
      - ./data/localstack/state:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles:
      - localstack
    restart: unless-stopped

volumes:
  ministack-state:
  ministack-s3:
  localstack-state:
