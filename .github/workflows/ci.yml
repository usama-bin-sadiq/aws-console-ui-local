name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify standalone output
        run: test -d .next/standalone && echo "Standalone build successful"

      - name: Upload standalone output
        uses: actions/upload-artifact@v4
        with:
          name: standalone-output
          path: .next/standalone/
          include-hidden-files: true

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          only-verified: true
          fail-on-verified: false

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

    needs: build

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation links
        run: npx markdown-link-check README.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

    needs: security-scan

  e2e-localstack:
    name: E2E Tests (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,lambda,dynamodb,iam,rds,cloudformation,cloudwatch,apigateway,eventbridge,secretsmanager,ssm,cognito
          DEFAULT_REGION: us-east-1
          DEBUG: 1
    needs: docs-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"status": "running"'; then
              echo "LocalStack is ready"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become ready in time" >&2
          exit 1

      - name: Start application
        run: |
          export ACTIVE_BACKEND=localstack
          export LOCALSTACK_HOSTNAME=localhost
          export LOCALSTACK_EDGE_PORT=4566
          export LOCALSTACK_ENDPOINT=http://localhost:4566
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=us-east-1
          pnpm dev &
          sleep 15

      - name: Run E2E tests
        uses: microsoft/playwright-github-action@v1
        with:
          config: playwright.config.ts
          reporter: html,json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-localstack
          path: test-results/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  e2e-responsive:
    name: E2E Responsive Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e-localstack
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run responsive E2E tests
        uses: microsoft/playwright-github-action@v1
        with:
          config: playwright.responsive.config.ts
          reporter: html

      - name: Upload responsive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-responsive-results
          path: test-results/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e-responsive
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update VRT baselines
        run: pnpm test:vrt:baseline

      - name: Run VRT
        uses: microsoft/playwright-github-action@v1
        with:
          config: playwright.vrt.config.ts

      - name: Upload VRT results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrt-results
          path: test-results/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  release:
    name: Release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: visual-regression
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download standalone output
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: standalone-output
          path: .next/standalone/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .next/standalone/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package from main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}
