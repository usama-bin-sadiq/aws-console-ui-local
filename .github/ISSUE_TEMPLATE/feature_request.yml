name: Feature Request
about: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: []
body:
  type: markdown
  attributes:
    overview: |
      Please fill out this form to request a feature.
  type: textarea
  attributes:
    problem_statement:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: |
        I'm frustrated when [situation]. I would like [feature] because [benefit].
      required: true
    proposed_solution:
      label: Proposed Solution
      description: A clear description of what you want to happen.
      placeholder: Describe the feature you'd like to see.
      required: true
    alternatives:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: |
        - Alternative A: [description]
        - Alternative B: [description]
    backend_impact:
      label: Backend Impact
      description: How would this affect LocalStack and/or MiniStack support?
      placeholder: |
        - LocalStack: [full/partial/none]
        - MiniStack: [full/partial/none]
        - Reasoning: [explanation]
    ui_ux_impact:
      label: UI/UX Impact
      description: How would this affect the AWS Console UI/UX parity?
      placeholder: Describe any UI changes needed.
    priority:
      label: Priority
      description: How important is this feature?
      options:
        - label: Low
          value: low
        - label: Medium
          value: medium
        - label: High
          value: high
    additional_context:
      label: Additional Context
      description: Any other context, screenshots, or mockups.
  type: checkboxes
  attributes:
    checks:
      - label: I have searched the existing issues
        required: true
      - label: This aligns with the project scope (emulator-based, not production AWS)
        required: true
      - label: I understand this must work with local emulators only
        required: true