name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify standalone output
        run: test -d .next/standalone && echo "Standalone build successful"

      - name: Upload standalone output
        uses: actions/upload-artifact@v7.0.2
        with:
          name: standalone-output
          path: .next/standalone/
          include-hidden-files: true

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          path: ./
          only-verified: true
          fail-on-verified: false

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

    needs: build

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation links
        run: npx markdown-link-check README.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

    needs: security-scan

  e2e-localemu:
    name: E2E Tests (LocalEmu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      localemu:
        image: localemu/localemu:latest
        ports:
          - 4566:4566
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        options: --user root
        env:
          PERSISTENCE: 1
          DEBUG: 0
          GATEWAY_LISTEN: 0.0.0.0:4566
          DASHBOARD_API_OPEN: 1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
    needs: docs-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for LocalEmu
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:4566/_localemu/health >/dev/null; then
              echo "LocalEmu is ready"
              exit 0
            fi
            sleep 2
          done
          echo "LocalEmu did not become ready in time" >&2
          exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          ACTIVE_BACKEND: localemu
          LOCALEMU_HOSTNAME: localhost
          LOCALEMU_EDGE_PORT: 4566
          LOCALEMU_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e2e-results-localemu
          path: test-results/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const runsByStatus = await Promise.all(
              ["in_progress", "queued"].map((status) =>
                github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  status,
                  per_page: 100,
                }),
              ),
            );
            const runs = runsByStatus.flat();
            const relatedRuns = runs.filter(
              (run) => run.id !== context.runId && run.head_sha === context.sha,
            );

            for (const run of relatedRuns) {
              core.info(`Cancelling ${run.name} run ${run.id}`);
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }

  e2e-responsive:
    name: E2E Responsive Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: e2e-localemu
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run responsive E2E tests
        run: pnpm test:e2e:responsive

      - name: Upload responsive test results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e2e-responsive-results
          path: test-results/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: e2e-responsive
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update VRT baselines
        run: pnpm test:vrt:baseline

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run VRT
        run: pnpm test:vrt

      - name: Upload VRT results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: vrt-results
          path: test-results/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  release:
    name: Release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: visual-regression
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download standalone output
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v8.0.2
        with:
          name: standalone-output
          path: .next/standalone/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            .next/standalone/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package from main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}
