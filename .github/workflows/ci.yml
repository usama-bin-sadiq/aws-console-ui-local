name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify standalone output
        run: test -d .next/standalone && echo "Standalone build successful"

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          only-verified: true
          fail-on-verified: false

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

    needs: build

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation links
        run: npx markdown-link-check README.md docs/architecture.md docs/adr/*.md

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}

    needs: security-scan

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-and-integration-tests, build, security-scan, docs-lint]
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Publish to GitHub Packages
        run: |
          echo "//registry.npmjs.org/:_authToken=\${{secrets.NPM_TOKEN}}" > .npmrc
          pnpm publish --access public

      - name: Cancel related workflows on failure
        if: failure()
        uses: ./.github/actions/cancel-related-workflows
        with:
          token: ${{ github.token }}
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
