# Docker Compose — LocalStack Mode Only
# Adapter: ADAPTER_MODE=localstack (port 4566)
# Usage: docker-compose -f docker-compose.localstack.yml up -d

services:
  localstack:
    image: localstack/localstack:latest
    container_name: aws-console-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,s3,lambda,iam,rds,dynamodb,vpc,cloudwatch,cloudtrail,config,cloudformation,route53,cloudfront,secretsmanager,kms,eventbridge,ecs,eks,ssm,lambda,logs
      - DEBUG=0
      - PERSISTENCE=1
      - LambdFlags=-p 4566
    volumes:
      - ./data/localstack/state:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  localstack-health:
    image: alpine/curl
    container_name: aws-console-localstack-health
    depends_on:
      - localstack
    command: ["/bin/sh", "-c", "while ! curl -f http://localstack:4566/_localstack/health; do sleep 1; done"]
    restart: unless-stopped

  aws-console:
    build: .
    container_name: aws-console-app-localstack
    ports:
      - "3000:3000"
    environment:
      - LOCALSTACK_HOSTNAME=localstack
      - LOCALSTACK_EDGE_PORT=4566
      - ADAPTER_MODE=localstack
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - localstack
      - localstack-health
    volumes:
      - .:/app
    command: ["npm", "run", "start"]

volumes:
  localstack-state:
